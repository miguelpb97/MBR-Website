<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  PARCHE PARA views/servicios-view.html                       ║
  ║  Añade carrito + auth a la página de servicios existente     ║
  ╚══════════════════════════════════════════════════════════════╝

  1) En <head>, después de chat-widget.css, añadir:
  ─────────────────────────────────────────────────────────────── -->
    <link rel="stylesheet" href="css/shop.css" />

  <!--
  2) En <div class="navbar__links">, justo antes del cierre </div>,
     añadir los botones de auth y carrito:
  ─────────────────────────────────────────────────────────────── -->
          <!-- Auth -->
          <span id="nav-user-name" class="nav-user-name"></span>
          <button id="nav-logout-btn" class="nav-logout-btn">Cerrar sesión</button>
          <button id="nav-auth-btn" class="navbar__link" style="background:none;border:none;cursor:pointer;color:inherit;font:inherit;">
            Iniciar sesión
          </button>

          <!-- Carrito -->
          <button class="cart-nav-btn" id="cart-toggle-btn" aria-label="Carrito">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <path d="M16 10a4 4 0 01-8 0"/>
            </svg>
            <span class="cart-badge" style="display:none">0</span>
          </button>

  <!--
  3) Antes del cierre </body>, después de los <script> existentes,
     añadir los modales y el script de shop:
  ─────────────────────────────────────────────────────────────── -->

    <!-- CARRITO SIDEBAR -->
    <div class="cart-overlay" id="cart-overlay"></div>
    <aside class="cart-panel" id="cart-panel">
      <div class="cart-panel__head">
        <span class="cart-panel__title">Carrito</span>
        <button class="cart-panel__close" onclick="toggleCart()">×</button>
      </div>
      <div class="cart-body" id="cart-body">
        <p class="cart-empty">Tu carrito está vacío.</p>
      </div>
      <div class="cart-footer" id="cart-footer">
        <div class="cart-total-row">
          <span class="cart-total-label">Total</span>
          <span class="cart-total-amount" id="cart-total">0,00 €</span>
        </div>
        <button class="cart-checkout-btn" id="cart-checkout-btn">Proceder al pago</button>
      </div>
    </aside>

    <!-- MODAL CHECKOUT -->
    <div class="mbr-modal" id="checkout-modal">
      <div class="mbr-modal__box">
        <button class="mbr-modal__close" id="checkout-close">×</button>
        <p class="mbr-modal__title">Finalizar compra</p>
        <div id="checkout-success" class="checkout-success">
          <div class="checkout-success__icon">✓</div>
          <p class="checkout-success__title">¡Pago realizado!</p>
          <p class="checkout-success__sub">Tu pedido <span class="order-id"></span> ha sido registrado.<br>Te contactaremos pronto.</p>
        </div>
        <div id="checkout-form">
          <div class="checkout-field">
            <label>Nombre</label>
            <input type="text"  id="checkout-name"  placeholder="Tu nombre" required />
          </div>
          <div class="checkout-field">
            <label>Email</label>
            <input type="email" id="checkout-email" placeholder="tu@email.com" required />
          </div>
          <div class="checkout-spinner" id="checkout-spinner">
            <div class="spinner"></div> Procesando pago…
          </div>
          <div id="paypal-button-container"></div>
        </div>
      </div>
    </div>

    <!-- MODAL AUTH -->
    <div class="mbr-modal" id="auth-modal">
      <div class="mbr-modal__box">
        <button class="mbr-modal__close" onclick="closeAuthModal()">×</button>
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Iniciar sesión</button>
          <button class="auth-tab" data-tab="register">Crear cuenta</button>
        </div>
        <div class="auth-panel" id="auth-login">
          <form id="auth-login-form">
            <div class="auth-field"><label>Email</label>
              <input type="email" id="login-email" autocomplete="email" required /></div>
            <div class="auth-field"><label>Contraseña</label>
              <input type="password" id="login-pass" autocomplete="current-password" required /></div>
            <p class="auth-error" id="login-error"></p>
            <button type="submit" class="auth-submit">Entrar</button>
          </form>
        </div>
        <div class="auth-panel" id="auth-register">
          <form id="auth-reg-form">
            <div class="auth-field"><label>Nombre</label>
              <input type="text" id="reg-name" autocomplete="name" required /></div>
            <div class="auth-field"><label>Email</label>
              <input type="email" id="reg-email" autocomplete="email" required /></div>
            <div class="auth-field"><label>Contraseña (mín. 8 caracteres)</label>
              <input type="password" id="reg-pass" autocomplete="new-password" minlength="8" required /></div>
            <p class="auth-error" id="reg-error"></p>
            <button type="submit" class="auth-submit">Crear cuenta</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="mbr-toast" id="mbr-toast"></div>

    <script src="js/shop.js"></script>

       grid.appendChild(item);
     });
